
<!-- Reusable administrative form field with validation feedback. -->
<div class="tf-user-form-field">

  {{ field.label_tag }}

  {{ field }}

  {% if field.help_text %}

    <div
      id="{{ field.auto_id }}_helptext"
      class="tf-user-form-help"
    >
      {{ field.help_text }}
    </div>

  {% endif %}

  {% if field.errors %}

    <div class="tf-user-form-errors">
      {{ field.errors }}
    </div>

  {% endif %}

</div>
